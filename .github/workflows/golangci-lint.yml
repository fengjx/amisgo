name: GolangCI-Lint

on:
  pull_request:
    branches:
      - 'dev'
      - 'main'

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          config: .github/linters/.golangci.yml
      - name: Run golangci-lint
        run: golangci-lint run --config .github/linters/.golangci.yml
